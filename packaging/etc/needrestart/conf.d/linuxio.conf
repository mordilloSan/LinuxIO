# LinuxIO: keep needrestart from restarting, by itself, the LinuxIO units that
# run work an update must not interrupt.
#
# On Ubuntu, apt runs needrestart after every dpkg run, and it restarts each
# service still running a binary that was replaced. A LinuxIO update replaces
# the binaries but leaves these units running on purpose: a job host of the
# older build runs on until it is idle (docs/jobs.md, Updates).
#
# packaging/scripts/install-linuxio-binaries.sh installs this file as
# /etc/needrestart/conf.d/linuxio.conf when /etc/needrestart exists; a system
# without needrestart gets nothing. packaging/scripts/uninstall.sh removes it.
#
# needrestart.conf evaluates each conf.d/*.conf as Perl after its own settings.
# Each line adds one regular expression to the distribution's
# $nrconf{override_rc} hash and keeps the entries already there; the value 0
# means "do not restart", so needrestart lists the unit under "Service restarts
# being deferred" instead. Checked against needrestart 3.11-1ubuntu2 on
# Ubuntu 26.04.
#
# The long-running daemons (linuxio-webserver, linuxio-monitoring,
# linuxio-indexer, linuxio-auth) are not listed: the installer restarts them.

# The job hosts, one per uid.
$nrconf{override_rc}->{qr(^linuxio-jobs@\d+\.service$)} = 0;

# The timer-run work, whose binaries an update also replaces.
$nrconf{override_rc}->{qr(^linuxio-schedule-.+\.service$)} = 0;
$nrconf{override_rc}->{qr(^linuxio-btrfs-snapshot\.service$)} = 0;
$nrconf{override_rc}->{qr(^linuxio-btrfs-replicate\.service$)} = 0;
$nrconf{override_rc}->{qr(^linuxio-btrfs-resync@.+\.service$)} = 0;
$nrconf{override_rc}->{qr(^linuxio-docker-update\.service$)} = 0;

# The transient unit an in-app update runs the installer in.
$nrconf{override_rc}->{qr(^linuxio-updater-\d+\.service$)} = 0;
