# tmpfiles.d configuration for LinuxIO
# This creates LinuxIO data and icon cache directories with proper permissions
#
# Format: Type Path Mode User Group Age
# Type d = directory
# Mode 1777 = rwxrwxrwt (world-writable with sticky bit)
#   - Anyone can create files
#   - Only file owner (or root) can delete their own files
#   - Shared cache with deletion protection
# Age - = never clean up

# Persistent application data
d /var/lib/linuxio 0755 root root -
d /var/lib/linuxio/users 0711 root root -

# Job stores: every uid's job host owns a 0700 <uid> leaf under these shared,
# traversable roots (created by its unit's StateDirectory/RuntimeDirectory)
d /var/lib/linuxio/jobs 0755 root root -
d /run/linuxio/jobs 0755 root root -

# Docker icon cache (persistent so icons survive reboots and work offline)
d /var/lib/linuxio/icons 1777 root root -

# Icon subdirectories
d /var/lib/linuxio/icons/dashboard-icons 1777 root root -
d /var/lib/linuxio/icons/simple-icons 1777 root root -
d /var/lib/linuxio/icons/url-cache 1777 root root -
d /var/lib/linuxio/icons/user 1777 root root -
