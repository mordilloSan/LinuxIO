name: Release (tag + build)

on:
  # Auto flow: merge dev/v* -> main
  pull_request:
    types: [closed]
    branches: [main]
  # Manual flow: run for a given tag (or latest)
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (leave blank to use latest v*)"
        required: false

permissions:
  contents: write

jobs:
  release:
    # Only run on:
    # - merged PRs where head is dev/v*
    # - manual dispatch
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'dev/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Decide the TAG we’ll release:
      # - For merged PR: extract vX.Y.Z from head branch dev/vX.Y.Z and create tag if missing
      # - For manual run: use input tag or latest v*
      - name: Resolve tag (and create if from PR)
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${{ github.event.pull_request.head.ref }}"        # e.g., dev/v0.2.4
            MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"
            TAG="${BRANCH#dev/}"                                      # -> v0.2.4
            echo "Derived tag from PR branch: $TAG (merge commit $MERGE_SHA)"

            # The checkout ref for a closed PR is not the merge commit; fetch
            # the base branch so the merge commit is available to tag.
            git fetch origin "${{ github.event.pull_request.base.ref }}"

            # Configure identity for tagging
            git config user.name  "${{ github.actor }}"
            git config user.email "${{ github.actor }}@users.noreply.github.com"

            # Tag exactly the merge commit; never release a different commit
            # under an existing tag.
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              EXISTING_SHA="$(git rev-parse "$TAG^{commit}")"
              if [[ "$EXISTING_SHA" != "$MERGE_SHA" ]]; then
                echo "Tag $TAG already exists at $EXISTING_SHA, but this merge is $MERGE_SHA."
                echo "Refusing to release a different commit under an existing tag."
                exit 1
              fi
              echo "Tag $TAG already exists at the expected merge commit."
            else
              git tag -a "$TAG" -m "Release $TAG" "$MERGE_SHA"
              if git push origin "$TAG"; then
                echo "Created tag $TAG at $MERGE_SHA"
              else
                echo "Tag push failed; checking for a concurrently created tag…"
                git fetch --tags --force
                EXISTING_SHA="$(git rev-parse "$TAG^{commit}")"
                if [[ "$EXISTING_SHA" != "$MERGE_SHA" ]]; then
                  echo "Remote tag $TAG points at $EXISTING_SHA, expected $MERGE_SHA."
                  exit 1
                fi
                echo "Tag $TAG was created concurrently at the expected merge commit."
              fi
            fi

          else  
            # Manual dispatch
            IN="${{ github.event.inputs.tag || '' }}"
            if [[ -n "$IN" ]]; then
              TAG="$IN"
              echo "Using user-provided tag: $TAG"
            else
              TAG="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"
              if [[ -z "$TAG" ]]; then
                echo "No v* tag found; please provide one via manual input."
                exit 1
              fi
              echo "Using latest tag: $TAG"
            fi

            # Validate local tag exists
            if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "Tag '$TAG' does not exist locally."
              exit 1
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout the tag's commit
        run: |
          git checkout "${{ steps.tag.outputs.tag }}"

      - name: Prepare install script for release
        run: |
          echo "Preparing install script for release..."

          # Copy install script to release directory
          cp packaging/scripts/install-linuxio-binaries.sh .

          # Generate checksum for install script
          sha256sum install-linuxio-binaries.sh > install-linuxio-binaries.sh.sha256

          echo "✓ Install script prepared"
          echo "Checksum:"
          cat install-linuxio-binaries.sh.sha256

      # ---- Build toolchains ----
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libdbus-1-dev libsystemd-dev pkg-config build-essential

      - name: Use Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Use Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/package.json
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend (Vite)
        run: make build-vite

      - name: Record frontend bundle metrics
        run: |
          cd frontend
          npm run bundle:metrics -- --markdown "$RUNNER_TEMP/frontend-bundle-metrics.md"
          cat "$RUNNER_TEMP/frontend-bundle-metrics.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Download Go modules
        working-directory: backend
        run: go mod download

      - name: Build Go bridge
        env: { GOOS: linux, GOARCH: amd64 }
        run: make build-bridge SKIP_ENSURE_GO=1

      - name: Build Go backend (with bridge hash)
        env: { GOOS: linux, GOARCH: amd64 }
        run: |
          BRIDGE_HASH=$(sha256sum linuxio-bridge | awk '{ print $1 }')
          echo "Bridge SHA256: $BRIDGE_HASH"
          make build-backend BRIDGE_SHA256=$BRIDGE_HASH SKIP_ENSURE_GO=1

      - name: Build Go auth helper
        env: { GOOS: linux, GOARCH: amd64 }
        run: make build-auth

      - name: Build CLI
        env: { GOOS: linux, GOARCH: amd64 }
        run: make build-cli SKIP_ENSURE_GO=1

      - name: Build Docker update worker
        env: { GOOS: linux, GOARCH: amd64 }
        run: make build-docker-update SKIP_ENSURE_GO=1

      - name: Make artifacts executable
        run: chmod +x linuxio linuxio-webserver linuxio-bridge linuxio-auth linuxio-docker-update

      - name: Create tarball
        id: create_tarball
        run: |
          TAR="linuxio-${{ steps.tag.outputs.tag }}-linux-amd64.tar.gz"
          tar czvf "$TAR" linuxio linuxio-webserver linuxio-bridge linuxio-auth linuxio-docker-update
          echo "tarball=$TAR" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          # Generate checksums for binaries and tarball
          sha256sum linuxio linuxio-webserver linuxio-bridge linuxio-auth linuxio-docker-update *.tar.gz > SHA256SUMS
          echo "=== Binary Checksums ==="
          cat SHA256SUMS

      - name: Verify binaries before release
        run: |
          # Verify linuxio CLI runs correctly
          chmod +x linuxio
          ./linuxio help || { echo "linuxio CLI verification failed"; exit 1; }
          echo "✓ linuxio CLI runs correctly"

          chmod +x linuxio-docker-update
          ./linuxio-docker-update help || { echo "Docker update worker verification failed"; exit 1; }
          echo "✓ linuxio-docker-update runs correctly"

          # Verify linuxio-webserver runs correctly
          chmod +x linuxio-webserver
          ./linuxio-webserver help || { echo "linuxio-webserver verification failed"; exit 1; }
          echo "✓ linuxio-webserver runs correctly"

          # Verify linuxio-bridge, linuxio-auth, are valid ELF executables
          # (they require special input/privileges to actually run)
          for bin in linuxio-bridge linuxio-auth; do
            chmod +x "$bin"
            file "$bin" | grep -q "ELF.*executable" || {
              echo "$bin is not a valid executable"
              exit 1
            }
            echo "✓ $bin is a valid ELF executable"
          done

      - name: Generate changelog from commits
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          # Find previous tag (the one before the current tag in version order)
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | awk -v tag="$TAG" 'found {print; exit} $0 == tag {found=1}')

          echo "Current tag: $TAG"
          echo "Previous tag: ${PREV_TAG:-none}"

          if [[ -n "$PREV_TAG" ]]; then
            COMMIT_RANGE="$PREV_TAG..$TAG"
          else
            # First release - changelog-entry.sh walks the full history
            COMMIT_RANGE=""
          fi

          # Same generator as `make open-pr`, so PR body and release notes match
          {
            echo "## $TAG — $(date -u +%Y-%m-%d)"
            echo ""
            ./packaging/scripts/changelog-entry.sh "$TAG" "$PREV_TAG" "$COMMIT_RANGE" "${{ github.repository }}"
          } > RELEASE_NOTES.md

          echo "--- Generated Changelog ---"
          cat RELEASE_NOTES.md

      - name: Create draft release
        id: create_release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.tag.outputs.tag }}
          draft: true
          bodyFile: RELEASE_NOTES.md
          artifacts: |
            ${{ steps.create_tarball.outputs.tarball }}
            linuxio
            linuxio-webserver
            linuxio-bridge
            linuxio-auth
            linuxio-docker-update
            SHA256SUMS
            install-linuxio-binaries.sh
            install-linuxio-binaries.sh.sha256

      - name: Publish release atomically
        if: success()
        run: |
          for i in {1..3}; do
            if gh release edit "${{ steps.tag.outputs.tag }}" --draft=false; then
              echo "Release published successfully"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          echo "Failed to publish release after 3 attempts"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}