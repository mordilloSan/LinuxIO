name: Release

# docs/releases.md describes this workflow, its gates and the owner's setup.
#
# gh release-flow merges dev/vX.Y.Z into main. The pull_request run of that
# merge only tags the merge commit and starts the release on the tag, then
# waits for it, so gh release-flow sees the release's outcome. The release
# itself is a workflow_dispatch run whose ref is the tag: the environments
# that hold the signing key and deploy Pages admit only v* tags, which no
# pull_request run has as its ref.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Sign, deploy the repositories and publish the GitHub release (run on a vX.Y.Z tag). Unticked, build and test the packages only."
        type: boolean
        default: false

env:
  # The name the repositories are served under. Installed hosts save it, so
  # it changes only before anyone else installs; the Pages custom domain and
  # the DNS record follow it (docs/releases.md, "Owner setup").
  PACKAGES_DOMAIN: packages.engmariz.com
  # How many releases the repositories hold, the new one included. Older
  # packages stay on GitHub Releases (docs/releases.md, "Repositories").
  KEPT_RELEASES: "5"

permissions: {}

defaults:
  run:
    shell: bash

# One publishing release at a time, never cancelled; the tagging run and dry
# runs each get a group of their own.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'release-publish' || format('release-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and start the release
    # Only a merged release PR from this repository: a fork's run has a
    # read-only token and could not push the tag.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dev/v')
    runs-on: ubuntu-latest
    # Waits while the release waits for approval in the release environment.
    timeout-minutes: 360
    permissions:
      contents: write # push the tag
      actions: write # start the release run on it
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag the merge commit
        id: tag
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          [[ $PR_HEAD_REF =~ ^dev/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::$PR_HEAD_REF is not dev/vX.Y.Z: a release version is three numbers"
            exit 1
          }
          tag="${PR_HEAD_REF#dev/}"
          git fetch --tags --force
          # The checkout of a closed PR is not the merge commit; fetch the
          # base branch so the merge commit can be tagged.
          git fetch origin "$PR_BASE_REF"
          git config user.name "$ACTOR"
          git config user.email "${ACTOR}@users.noreply.github.com"
          # Tag exactly the merge commit; never release another commit under
          # an existing tag.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            existing="$(git rev-parse "$tag^{commit}")"
            if [[ $existing != "$PR_MERGE_SHA" ]]; then
              echo "::error::Tag $tag is at $existing, this merge is $PR_MERGE_SHA; refusing to release another commit under it"
              exit 1
            fi
            echo "Tag $tag already exists at the merge commit."
          else
            git tag -a "$tag" -m "Release $tag" "$PR_MERGE_SHA"
            if ! git push origin "refs/tags/$tag"; then
              git fetch --tags --force
              existing="$(git rev-parse "$tag^{commit}")"
              if [[ $existing != "$PR_MERGE_SHA" ]]; then
                echo "::error::Remote tag $tag is at $existing, expected $PR_MERGE_SHA"
                exit 1
              fi
            fi
            echo "Tagged $PR_MERGE_SHA as $tag."
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      # A run started with the GITHUB_TOKEN by workflow_dispatch is the one
      # kind GitHub lets a workflow start.
      - name: Start the release on the tag and wait for it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if ! answer="$(gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" \
            -f ref="$TAG" -f 'inputs[publish]=true' 2>&1)"; then
            echo "::error::Could not start the release run for $TAG: $answer"
            exit 1
          fi
          run_id="$(jq -r '.workflow_run_id // empty' <<<"${answer:-null}" 2>/dev/null || true)"
          if [[ -z $run_id ]]; then
            # The dispatch answered without a run id: find the run it made.
            for _ in $(seq 1 20); do
              run_id="$(gh run list --workflow release.yml --event workflow_dispatch --branch "$TAG" \
                --created ">=$started" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
              [[ -n $run_id ]] && break
              sleep 6
            done
          fi
          [[ -n $run_id ]] || { echo "::error::Started the release run for $TAG but could not find it"; exit 1; }
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
          echo "Release run for $TAG: $url"
          echo "Release run for \`$TAG\`: $url" >>"$GITHUB_STEP_SUMMARY"
          if ! gh run watch "$run_id" --exit-status --interval 30 >/dev/null; then
            gh run view "$run_id" || true
            echo "::error::The release run for $TAG did not succeed: $url"
            exit 1
          fi

  prepare:
    name: Read the build pins
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      compile_image: ${{ steps.pins.outputs.COMPILE_IMAGE }}
      rpm_image: ${{ steps.pins.outputs.RPM_IMAGE }}
      node_version: ${{ steps.pins.outputs.NODE_VERSION }}
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read packaging/build/pins.env
        id: pins
        run: grep -E '^[A-Z][A-Z0-9_]*=' packaging/build/pins.env >>"$GITHUB_OUTPUT"

      - name: Check the ref
        id: ref
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ $GITHUB_REF =~ ^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "tag=${BASH_REMATCH[1]}" >>"$GITHUB_OUTPUT"
          elif [[ $PUBLISH == true ]]; then
            echo "::error::Only a vX.Y.Z tag is published; $GITHUB_REF is not one. Run without publish for a dry run."
            exit 1
          fi

  compile:
    name: Compile and assemble the DEB
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare.outputs.compile_image }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # The release, not the day, decides these versions: the image is pinned.
      - name: Install the build packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl debhelper file git libpam0g-dev libsystemd-dev pkg-config xz-utils zstd

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # No caches in a release: what a restored cache holds is not what the
      # lock files name until something checks it.
      - name: Use Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Use Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.prepare.outputs.node_version }}
          package-manager-cache: false

      - name: Decide the package version
        id: version
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(packaging/scripts/package-version.sh)"
          if [[ -n $TAG && $version != "${TAG#v}" ]]; then
            echo "::error::The checkout gives version $version, the tag $TAG"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Build the frontend and the programs
        env: { GOOS: linux, GOARCH: amd64 }
        run: make ci-frontend-deps build-vite build-binaries SKIP_ENSURE_GO=1

      - name: Record the frontend bundle sizes
        run: |
          {
            echo '### Frontend bundle'
            echo '```'
            make -s bundle-metrics
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Assemble the DEB
        run: make package-deb PACKAGE_VERSION="${{ steps.version.outputs.version }}" PACKAGES_DIR=build/packages

      - name: Test the DEB
        run: make test-packages-quiet PACKAGE_VERSION="${{ steps.version.outputs.version }}" PACKAGES_DIR=build/packages

      # A tar keeps the modes the package layout checks; the RPM gets these
      # bytes, not a second compile.
      - name: Pack the programs
        run: |
          set -euo pipefail
          mapfile -t programs < <(make -s print-binaries)
          tar -C "$(make -s print-bin-dir)" -cf programs.tar "${programs[@]}"
          tar -tvf programs.tar

      - name: Keep the programs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: programs
          path: programs.tar
          if-no-files-found: error
          retention-days: 7

      - name: Keep the DEB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: build/packages/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compile-test-logs
          path: .cache/test-logs
          if-no-files-found: ignore
          retention-days: 7

  rpm:
    name: Assemble the RPM
    needs: [prepare, compile]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare.outputs.rpm_image }}
    permissions:
      contents: read
    steps:
      - name: Install the packaging tools
        run: dnf install -y --setopt=install_weak_deps=False git make tar rpm-build selinux-policy-devel systemd-devel systemd-rpm-macros

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the programs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: programs

      - name: Unpack the programs
        run: |
          set -euo pipefail
          mkdir -p "$(make -s print-bin-dir)"
          tar -C "$(make -s print-bin-dir)" -xpf programs.tar
          rm programs.tar

      - name: Assemble the RPM
        run: make package-rpm PACKAGE_VERSION="${{ needs.compile.outputs.version }}" PACKAGES_DIR=build/packages

      - name: Test the RPM
        run: make test-packages-quiet PACKAGE_VERSION="${{ needs.compile.outputs.version }}" PACKAGES_DIR=build/packages

      - name: Keep the RPM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm
          path: build/packages/*.rpm
          if-no-files-found: error
          retention-days: 7

      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-test-logs
          path: .cache/test-logs
          if-no-files-found: ignore
          retention-days: 7

  repositories:
    name: Sign and assemble the repositories
    needs: [prepare, compile, rpm]
    if: inputs.publish && needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare.outputs.rpm_image }}
    # Holds LINUXIO_SIGNING_KEY. It admits only v* tags and waits for a
    # required reviewer (docs/releases.md, "Owner setup").
    environment: release
    permissions:
      contents: read # the earlier releases' packages
    steps:
      - name: Install the repository tools
        run: dnf install -y --setopt=install_weak_deps=False apt-utils createrepo_c dpkg git gnupg2 jq make rpm-sign tar

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the new DEB
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
          path: build/repo-packages

      - name: Fetch the new RPM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rpm
          path: build/repo-packages

      - name: Fetch the packages of the releases kept beside it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          packaging/build/previous-packages.sh --repo "$GITHUB_REPOSITORY" --tag "$TAG" \
            --keep "$KEPT_RELEASES" --out-dir build/repo-packages
          ls -l build/repo-packages

      # The secret is the signing subkey alone, without a passphrase: the
      # primary key never leaves the owner's offline copy. It lives in a
      # GnuPG home of this job that the last step deletes.
      - name: Import the signing subkey
        id: key
        env:
          LINUXIO_SIGNING_KEY: ${{ secrets.LINUXIO_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [[ -f packaging/keys/linuxio.asc ]] || {
            echo "::error::packaging/keys/linuxio.asc is missing: commit the public key first (docs/releases.md)"
            exit 1
          }
          [[ -n $LINUXIO_SIGNING_KEY ]] || { echo "::error::LINUXIO_SIGNING_KEY is empty"; exit 1; }
          gnupghome="$RUNNER_TEMP/gnupg"
          install -d -m 0700 "$gnupghome"
          echo "GNUPGHOME=$gnupghome" >>"$GITHUB_ENV"
          export GNUPGHOME="$gnupghome"
          printf '%s\n' "$LINUXIO_SIGNING_KEY" | gpg --batch --quiet --import
          imported="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          committed="$(gpg --batch --with-colons --show-keys packaging/keys/linuxio.asc | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [[ -z $imported || $imported != "$committed" ]]; then
            echo "::error::The signing subkey belongs to ${imported:-no key}, packaging/keys/linuxio.asc to $committed"
            exit 1
          fi
          echo "fingerprint=$imported" >>"$GITHUB_OUTPUT"

      - name: Assemble the signed repositories
        run: |
          make repo-apt repo-rpm PACKAGES_DIR=build/repo-packages REPO_DIR=build/repo \
            REPO_SIGNING_KEY="${{ steps.key.outputs.fingerprint }}" REPO_BASE_URL="https://$PACKAGES_DOMAIN"

      # Checked against the committed public key, not the keyring that signed.
      - name: Check the signatures
        run: |
          set -euo pipefail
          check="$RUNNER_TEMP/check-gnupg"
          install -d -m 0700 "$check"
          gpg --homedir "$check" --batch --quiet --import packaging/keys/linuxio.asc
          gpg --homedir "$check" --batch --verify build/repo/apt/dists/stable/InRelease
          gpg --homedir "$check" --batch --verify build/repo/apt/dists/stable/Release.gpg build/repo/apt/dists/stable/Release
          gpg --homedir "$check" --batch --verify build/repo/rpm/stable/x86_64/repodata/repomd.xml.asc build/repo/rpm/stable/x86_64/repodata/repomd.xml
          rpmkeys --import packaging/keys/linuxio.asc
          for rpm in build/repo/rpm/stable/x86_64/*.rpm; do
            out="$(rpmkeys --checksig "$rpm")"
            echo "$out"
            # A package without a signature still reports its digests OK.
            [[ $out == *"signatures OK"* ]] || { echo "::error::$rpm is not signed by packaging/keys/linuxio.asc"; exit 1; }
          done
          rm -rf "$check"
          du -sh build/repo
          {
            echo '### Repository tree'
            echo '```'
            du -ah build/repo | sort -k2
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Forget the signing subkey
        if: always()
        run: |
          if [[ -n ${GNUPGHOME:-} ]]; then
            gpgconf --kill all || true
            rm -rf "$GNUPGHOME"
          fi

      # The release assets: this version's DEB, its signed RPM, and their sums.
      - name: Collect the release assets
        env:
          VERSION: ${{ needs.compile.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "build/repo/apt/pool/main/l/linuxio/linuxio_${VERSION}_amd64.deb" release-assets/
          cp build/repo/rpm/stable/x86_64/linuxio-"${VERSION}"-*.x86_64.rpm release-assets/
          (cd release-assets && sha256sum -- * >SHA256SUMS && cat SHA256SUMS)

      - name: Keep the release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 7

      - name: Keep the repository tree for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/repo

  deploy:
    name: Deploy the repositories to Pages
    needs: repositories
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://${{ env.PACKAGES_DOMAIN }}/
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  publish:
    name: Publish the GitHub release
    needs: [prepare, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Write the release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          prev="$(git tag -l 'v*' --sort=-v:refname | awk -v tag="$TAG" 'found { print; exit } $0 == tag { found = 1 }')"
          range=""
          [[ -n $prev ]] && range="$prev..$TAG"
          # The generator gh release-flow open-pr uses, so the PR body and the
          # release notes match.
          {
            echo "## $TAG — $(date -u +%Y-%m-%d)"
            echo ""
            ./.github/scripts/changelog-entry.sh "$TAG" "$prev" "$range" "$GITHUB_REPOSITORY"
          } >RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      # A draft first, with every asset, then published in one step: an
      # immutable release cannot gain assets once published.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ $draft != true ]]; then
              echo "::error::Release $TAG is already published"
              exit 1
            fi
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file RELEASE_NOTES.md release-assets/*
          for attempt in 1 2 3; do
            gh release edit "$TAG" --draft=false && exit 0
            echo "Publishing attempt $attempt failed; retrying"
            sleep 5
          done
          echo "::error::Could not publish release $TAG"
          exit 1
