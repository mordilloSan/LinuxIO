name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "33 21 * * 2"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            dependency_caching: false
          - language: c-cpp
            build-mode: manual
            dependency_caching: false
          - language: go
            build-mode: manual
            dependency_caching: true
          - language: javascript-typescript
            build-mode: none
            dependency_caching: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Install C build dependencies
        if: matrix.language == 'c-cpp'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libsystemd-dev pkg-config

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          dependency-caching: ${{ matrix.dependency_caching }}
          config-file: ./.github/codeql/codeql-config.yml
          # queries: security-extended,security-and-quality

      - name: Prepare embedded frontend placeholders
        if: matrix.language == 'go'
        shell: bash
        run: |
          make dev-prep

      - name: Build Go targets
        if: matrix.language == 'go'
        shell: bash
        run: |
          make build-go-binaries SKIP_ENSURE_GO=1

      - name: Build C auth helper
        if: matrix.language == 'c-cpp'
        shell: bash
        run: |
          make build-auth

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
