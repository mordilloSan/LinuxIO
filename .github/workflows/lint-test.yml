name: Lint and Test

on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
  push:
    # Pull requests cover development/release branches. Keep direct-push CI
    # for the protected release target only to avoid duplicate PR runs.
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node and the Go check tools at the versions packaging/build/pins.env pins.
      - name: Read the build pins
        run: grep -E '^[A-Z][A-Z0-9_]*=' packaging/build/pins.env >>"$GITHUB_ENV"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      # Needed for github.com/msteinert/pam (CGO)
      - name: Install PAM headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpam0g-dev
      # For embedded files in go
      - name: Create Frontend Files
        run: |
          make dev-prep
      - name: Run modernize
        working-directory: backend
        run: |
          go run "golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@${MODERNIZE_VERSION}" -fix ./...
          if [ -n "$(git status --porcelain -- .)" ]; then
            echo " Go modernize produced changes. Run 'make golint' locally."
            git diff -- .
            exit 1
          fi
      - name: Run govulncheck
        working-directory: backend
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend
          install-mode: goinstall

  format-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
      - name: Check Go formatting
        working-directory: backend
        run: |
          go fmt ./...
          if [ -n "$(git status --porcelain)" ]; then
            echo " Go files are not formatted. Run 'make golint' locally."
            git diff
            exit 1
          fi
          echo " All Go files are properly formatted"

  auth-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install authentication analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bear clang-tidy clang-tools cppcheck libpam0g-dev libsystemd-dev
      - run: make analyze-auth

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node and the Go check tools at the versions packaging/build/pins.env pins.
      - name: Read the build pins
        run: grep -E '^[A-Z][A-Z0-9_]*=' packaging/build/pins.env >>"$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make lint-ci
  typescript-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node and the Go check tools at the versions packaging/build/pins.env pins.
      - name: Read the build pins
        run: grep -E '^[A-Z][A-Z0-9_]*=' packaging/build/pins.env >>"$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make tsc-ci

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node and the Go check tools at the versions packaging/build/pins.env pins.
      - name: Read the build pins
        run: grep -E '^[A-Z][A-Z0-9_]*=' packaging/build/pins.env >>"$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and run frontend tests
        run: make test-frontend-ci

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      # Needed for github.com/msteinert/pam (CGO) and the C auth tests
      - name: Install authentication helper dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpam0g-dev libsystemd-dev
      # For embedded files in go
      - name: Create Frontend Files
        run: |
          make dev-prep
      - run: make test-backend SKIP_ENSURE_GO=1
