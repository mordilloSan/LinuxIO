name: Lint and Test

on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
  push:
    # Pull requests cover development/release branches. Keep direct-push CI
    # for the protected release target only to avoid duplicate PR runs.
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      # Needed for github.com/msteinert/pam (CGO)
      - name: Install PAM headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpam0g-dev
      # For embedded files in go
      - name: Create Frontend Files
        run: |
          make dev-prep
      - name: Run modernize
        working-directory: backend
        run: |
          go run golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@latest -fix ./...
          if [ -n "$(git status --porcelain -- .)" ]; then
            echo " Go modernize produced changes. Run 'make golint' locally."
            git diff -- .
            exit 1
          fi
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: "latest"
          working-directory: backend
          install-mode: goinstall

  format-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
      - name: Check Go formatting
        working-directory: backend
        run: |
          go fmt ./...
          if [ -n "$(git status --porcelain)" ]; then
            echo " Go files are not formatted. Run 'make golint' locally."
            git diff
            exit 1
          fi
          echo " All Go files are properly formatted"

  auth-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install authentication analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bear clang-tidy clang-tools cppcheck libpam0g-dev libsystemd-dev
      - run: make analyze-auth

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make lint-ci
  typescript-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make tsc-ci

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/package.json
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and run frontend tests
        run: make test-frontend-ci

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      # Needed for github.com/msteinert/pam (CGO) and the C auth tests
      - name: Install authentication helper dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpam0g-dev libsystemd-dev
      # For embedded files in go
      - name: Create Frontend Files
        run: |
          make dev-prep
      - run: make test-backend SKIP_ENSURE_GO=1
