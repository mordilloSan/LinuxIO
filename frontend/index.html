<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="/favicon-5.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/manifest.json" />
    <title>Linux i/O</title>
    <meta name="description" content="Linux Server" />
    <meta name="keywords" content="linux,react,go" />
    <meta name="author" content="Mordillo" />
    <script>
      (function () {
        try {
          var DARK = {
            scheme: "dark",
            bg: "#1B2635",
            text: "rgba(255, 255, 255, 0.95)",
            primary: "#407AD6",
          };
          var LIGHT = {
            scheme: "light",
            bg: "#F7F9FC",
            text: "rgba(0, 0, 0, 0.87)",
            primary: "#376FD0",
          };
          function isValid(v) {
            return (
              v &&
              typeof v === "object" &&
              (v.scheme === "light" || v.scheme === "dark") &&
              typeof v.bg === "string" &&
              v.bg.length > 0 &&
              typeof v.text === "string" &&
              v.text.length > 0
            );
          }
          var t;
          if (location.pathname === "/sign-in") {
            t = DARK;
          } else {
            var stored = null;
            try {
              stored = JSON.parse(
                localStorage.getItem("linuxio_theme_bootstrap") || "null"
              );
            } catch (e) {}
            if (isValid(stored)) {
              t = stored;
            } else {
              t =
                window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: light)").matches
                  ? LIGHT
                  : DARK;
            }
          }
          var s = document.documentElement.style;
          s.setProperty("--app-color-scheme", t.scheme);
          s.setProperty("--app-palette-background-default", t.bg);
          s.setProperty("--app-palette-text-primary", t.text);
          s.setProperty(
            "--app-palette-primary-main",
            typeof t.primary === "string" && t.primary.length > 0
              ? t.primary
              : t.scheme === "light"
                ? LIGHT.primary
                : DARK.primary
          );
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        color-scheme: var(--app-color-scheme, dark);
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        background: var(--app-palette-background-default, #1b2635);
        color: var(--app-palette-text-primary, rgba(255, 255, 255, 0.95));
      }
      .page-loader {
        position: absolute;
        inset: 0;
        z-index: 1000;
        background: var(--app-palette-background-default, #1b2635);
      }
      #app-bootstrap-loader {
        position: fixed;
        z-index: 1400;
      }
      .page-loader__dots {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1301;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .page-loader__dot {
        display: block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--app-palette-primary-main, #407ad6);
        animation: pl-pulse 1.2s ease-in-out infinite;
      }
      .page-loader__dot:nth-child(2) {
        animation-delay: 160ms;
      }
      .page-loader__dot:nth-child(3) {
        animation-delay: 320ms;
      }
      @keyframes pl-pulse {
        0%,
        100% {
          transform: scale(0.5);
          opacity: 0.3;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .page-loader__dot {
          animation: none;
          opacity: 0.7;
          transform: scale(0.75);
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      <style>
        #app-bootstrap-loader {
          display: none;
        }
      </style>
      You need to enable JavaScript to run this app.
    </noscript>
    <div
      id="app-bootstrap-loader"
      class="page-loader"
      role="status"
      aria-label="Loading Linux i/O"
    >
      <div class="page-loader__dots" aria-hidden="true">
        <span class="page-loader__dot"></span>
        <span class="page-loader__dot"></span>
        <span class="page-loader__dot"></span>
      </div>
    </div>
    <div id="root" inert aria-busy="true"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
