<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="/favicon-5.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/manifest.json" />
    <title>Linux i/O</title>
    <meta name="description" content="Linux Server" />
    <meta name="keywords" content="linux,react,go" />
    <meta name="author" content="Mordillo" />
    <script>
      (function () {
        try {
          var DARK = {
            scheme: "dark",
            bg: "#1B2635",
            text: "rgba(255, 255, 255, 0.95)",
            primary: "#407ad6",
          };
          var LIGHT = {
            scheme: "light",
            bg: "#F7F9FC",
            text: "rgba(15, 15, 15, 0.95)",
            primary: "#376fd0",
          };
          // Only plain colours pass: a stored value never reaches the page
          // as a url() or as anything that could carry a second declaration.
          var COLOR = /^(#[0-9a-f]{3,8}|(rgb|hsl)a?\([0-9a-z\s.,%\/+-]+\))$/i;
          var pick = function (value, fallback) {
            return typeof value === "string" && COLOR.test(value)
              ? value
              : fallback;
          };
          var t = DARK;
          if (location.pathname !== "/sign-in") {
            var hint = null;
            try {
              hint = JSON.parse(
                localStorage.getItem("linuxio.bootTheme") || "null"
              );
            } catch (e) {}
            if (hint && (hint.scheme === "light" || hint.scheme === "dark")) {
              var base = hint.scheme === "light" ? LIGHT : DARK;
              t = {
                scheme: base.scheme,
                bg: pick(hint.bg, base.bg),
                text: pick(hint.text, base.text),
                primary: pick(hint.primary, base.primary),
              };
            } else if (
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches
            ) {
              t = LIGHT;
            }
          }
          var s = document.documentElement.style;
          s.setProperty("--app-color-scheme", t.scheme);
          s.setProperty("--app-palette-background-default", t.bg);
          s.setProperty("--app-palette-text-primary", t.text);
          s.setProperty("--app-palette-primary-main", t.primary);
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        color-scheme: var(--app-color-scheme, dark);
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        background: var(--app-palette-background-default, #1b2635);
        color: var(--app-palette-text-primary, rgba(255, 255, 255, 0.95));
      }
      .page-loader {
        position: absolute;
        inset: 0;
        z-index: 1000;
        background: var(--app-palette-background-default, #1b2635);
      }
      #app-bootstrap-loader {
        position: fixed;
        z-index: 1400;
      }
      .page-loader__dots {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1301;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .page-loader__dot {
        display: block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--app-palette-primary-main, #407ad6);
        animation: pl-pulse 1.2s ease-in-out infinite;
      }
      .page-loader__dot:nth-child(2) {
        animation-delay: 160ms;
      }
      .page-loader__dot:nth-child(3) {
        animation-delay: 320ms;
      }
      @keyframes pl-pulse {
        0%,
        100% {
          transform: scale(0.5);
          opacity: 0.3;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .page-loader__dot {
          animation: none;
          opacity: 0.7;
          transform: scale(0.75);
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      <style>
        #app-bootstrap-loader {
          display: none;
        }
      </style>
      You need to enable JavaScript to run this app.
    </noscript>
    <div
      id="app-bootstrap-loader"
      class="page-loader"
      role="status"
      aria-label="Loading Linux i/O"
    >
      <div class="page-loader__dots" aria-hidden="true">
        <span class="page-loader__dot"></span>
        <span class="page-loader__dot"></span>
        <span class="page-loader__dot"></span>
      </div>
    </div>
    <div id="root" inert aria-busy="true"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
