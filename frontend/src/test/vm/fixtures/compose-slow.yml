# "app" starts only once "slow" reports healthy, about 30 seconds after it
# starts, so `docker compose up -d` runs that long.
services:
  slow:
    image: busybox:1.37
    init: true
    command: ["sh", "-c", "sleep 30 && touch /tmp/ready && exec tail -f /dev/null"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 2s
      start_period: 60s
  app:
    image: busybox:1.37
    init: true
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      slow:
        condition: service_healthy
