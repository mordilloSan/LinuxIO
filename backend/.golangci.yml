version: "2"
linters:
  settings:
    staticcheck:
      checks:
        - all
        - "-QF1001"
        - "-ST1003"
        - "-ST1016"
        - "-QF1004"
        - "-QF1003"
        - "-SA4006"
    cyclop:
      max-complexity: 30
      package-average: 10
    errcheck:
      check-type-assertions: true
    exhaustive:
      # A default clause counts as handling the remaining enum values, and
      # partial maps keyed by an enum (env overrides, test tables) are fine.
      default-signifies-exhaustive: true
      check:
        - switch
    gocognit:
      min-complexity: 20
    gocritic:
      settings:
        captLocal:
          paramsOnly: false
        underef:
          skipRecvDeref: false
    gomodguard_v2:
      blocked:
        - module: github.com/godbus/dbus
          match-type: exact
          recommendations:
            - github.com/godbus/dbus/v5
          reason: use the v5 module path
        - module: github.com/golang/protobuf
          match-type: exact
          recommendations:
            - google.golang.org/protobuf
          reason: see https://developers.google.com/protocol-buffers/docs/reference/go/faq#modules
        - module: github.com/satori/go.uuid
          match-type: exact
          recommendations:
            - github.com/google/uuid
          reason: satori's package is not maintained
        - module: github.com/gofrs/uuid
          match-type: exact
          recommendations:
            - github.com/gofrs/uuid/v5
          reason: gofrs' package was not go module before v5
    govet:
      disable:
        - fieldalignment
      enable-all: true
      settings:
        shadow:
          strict: false
    nakedret:
      max-func-lines: 0
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-no-explanation:
        - gocognit
    rowserrcheck:
      packages:
        - github.com/jmoiron/sqlx
    unused:
      field-writes-are-uses: true
      post-statements-are-reads: true
      exported-fields-are-used: true
      parameters-are-used: true
      local-variables-are-used: true
      generated-is-used: true
  enable:
    - bodyclose
    - cyclop
    - dupl
    - durationcheck
    - errorlint
    - exhaustive
    - gocognit
    - gocritic
    - gomodguard_v2
    - makezero
    - nakedret
    - nilnesserr
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gocritic
        source: //noinspection
      - linters:
          - bodyclose
          - dupl
          - errorlint
          - unparam
        path: _test\.go
      # Calls that already wrap one error with %w keep the secondary cause
      # (rollback, cleanup, decode, indexer) as text on purpose: wrapping it
      # too would add errors.Is/As matches for it, such as cancellation, that
      # callers and statusCode do not see today.
      - linters:
          - errorlint
        text: non-wrapping format verb
        source: '%w.*%v'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 50
formatters:
  settings:
    gofmt:
      simplify: true
    gci:
      custom-order: true
      sections:
        - standard
        - default
        - prefix(github.com/mordilloSan/LinuxIO/backend)
  enable:
    - gofmt
    - gci
